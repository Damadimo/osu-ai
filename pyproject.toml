[project]
name = "osu-ai"
version = "0.1.0"
description = "A small vision model that plays osu!lazer from screen capture"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28",
    "numpy>=2.5.3",
    "osrparse>=7.0.1",
    "pygame-ce>=2.5.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
local = [
    "laya[serve]>=0.3.11",
]
train = [
    "mlx-lm>=0.31.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osu_ai"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
